# Test infrastructure for OpenLabels
# Usage: docker-compose -f docker-compose.test.yml up -d
# Then: export TEST_DATABASE_URL="postgresql+asyncpg://postgres:${POSTGRES_TEST_PASSWORD:-openlabels_test_c8f2e9a1b4d7}@localhost:5432/openlabels_test"
#       export REDIS_URL="redis://localhost:6379"
#       pytest tests/
#
# Override via POSTGRES_TEST_PASSWORD / REDIS_TEST_PASSWORD env vars

services:
  postgres:
    image: postgres:15
    container_name: openlabels-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-openlabels_test_c8f2e9a1b4d7}
      POSTGRES_DB: openlabels_test
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openlabels-test-redis
    command: redis-server --requirepass ${REDIS_TEST_PASSWORD:-openlabels_test_c8f2e9a1b4d7}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_TEST_PASSWORD:-openlabels_test_c8f2e9a1b4d7}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
  redis_test_data:
